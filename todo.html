<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>to-do-list | Dev Rai</title>
    <link rel="stylesheet" href="todo.css" />
  </head>
  <body>
    <div class="inbox">
      <div class="inboxHead">
        <div class="inboxTop">
          <img src="image/right-arrow.png" />
          <h2>Inbox</h2>
        </div>
        <div class="inboxItems">
          <input type="text" id="inputBox" placeholder="Add your text" />
          <button onclick="addTask()">+</button>
        </div>
        <ul id="listContainer">
          <!-- <li class="checked">Task 1</li>
          <li>Task 2</li>
          <li>Task 3</li>
        </ul> -->
      </div>
    </div>
    <script src="todo.js"></script>
  </body>
</html>
